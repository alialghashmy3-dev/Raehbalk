<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>MediPrice AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="bg-gray-100 p-6">

  <h1 class="text-3xl font-bold text-center mb-6">
    MediPrice AI - تحليل الأسعار الطبية
  </h1>

  <!-- لوحة الإحصائيات -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

    <div class="bg-white p-4 rounded-xl shadow">
      <h2>عدد المنشآت</h2>
      <p id="facilitiesCount" class="text-2xl font-bold">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2>عدد الخدمات</h2>
      <p id="servicesCount" class="text-2xl font-bold">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow">
      <h2>متوسط الأسعار</h2>
      <p id="avgPrice" class="text-2xl font-bold">0</p>
    </div>

  </div>

  <!-- قائمة المنشآت -->
  <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

<script>
  // 🔌 ربط Supabase
  const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
  const SUPABASE_KEY = "YOUR_ANON_KEY";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 📊 تحميل الإحصائيات
  async function loadStats() {

    const { data: facilities } = await client.from('facilities').select('*');
    const { data: services } = await client.from('services').select('*');
    const { data: pricing } = await client.from('pricing').select('price');

    document.getElementById("facilitiesCount").innerText = facilities.length;
    document.getElementById("servicesCount").innerText = services.length;

    if (pricing.length > 0) {
      const avg = pricing.reduce((a,b)=>a + b.price, 0) / pricing.length;
      document.getElementById("avgPrice").innerText = avg.toFixed(2);
    }
  }

  // 🏥 تحميل المنشآت
  async function loadFacilities() {
    const { data } = await client.from('facilities').select('*');

    document.getElementById("list").innerHTML =
      data.map(f => `
        <div class="bg-white p-4 rounded-xl shadow">
          <h3 class="text-xl font-bold">${f.name}</h3>
          <p>📍 ${f.city || "غير محدد"}</p>
          <p>📞 ${f.phone || "-"}</p>
        </div>
      `).join('');
  }

  // 🚀 تشغيل النظام
  loadStats();
  loadFacilities();
</script>

</body>
</html>
