<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SAP ERP AI</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
body{margin:0;font-family:Cairo;background:#eef2f7}
header{background:#0f766e;color:white;padding:18px;text-align:center}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

input,button{width:100%;padding:10px;margin-top:8px}
button{background:#0f766e;color:white;border:none}
</style>
</head>

<body>

<header>🏢 SAP ERP AI System</header>

<div class="grid">

<!-- AI -->
<div class="card">
<h3>🤖 SAP AI</h3>
<input id="msg">
<button onclick="ask()">Run</button>
<p id="out"></p>
</div>

<!-- TASKS -->
<div class="card">
<h3>📋 Tasks</h3>
<input id="task">
<button onclick="add()">Add</button>
<button onclick="load()">Load</button>
<ul id="list"></ul>
</div>

</div>

<script>

const API="http://localhost:3000";
let token="demo"; // لاحقاً JWT

async function ask(){
let res=await axios.post(API+"/ai",
{message:msg.value},
{headers:{Authorization:token}}
);

out.innerText=res.data.reply;
}

async function add(){
await axios.post(API+"/tasks",
{title:task.value},
{headers:{Authorization:token}}
);
}

async function load(){
let res=await axios.get(API+"/tasks",
{headers:{Authorization:token}}
);

list.innerHTML="";
res.data.forEach(t=>{
let li=document.createElement("li");
li.textContent="📌 "+t.title;
list.appendChild(li);
});
}

</script>

</body>
</html>
